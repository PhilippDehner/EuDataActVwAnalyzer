<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cupra Datenexport</title>
<script>try{var th=JSON.parse(localStorage.getItem('cupraviz.theme'));if(th==='light'||th==='dark')document.documentElement.dataset.theme=th}catch(e){}</script>
<link rel="stylesheet" href="style.css?v=1.2.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='6' width='16' height='12' rx='2' fill='none' stroke='%23b0703e' stroke-width='2'/%3E%3Crect x='19' y='10' width='2' height='4' fill='%23b0703e'/%3E%3Crect x='5' y='8' width='8' height='8' fill='%23b0703e'/%3E%3C/svg%3E">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <div>
      <h1 data-i18n="appTitle">Cupra Datenexport</h1>
      <div class="sub" id="vehicleLine">EU Data Act · lokal im Browser</div>
    </div>
  </div>
  <div class="actions">
    <label class="btn primary"><span data-i18n="loadFiles">Dateien laden</span>
      <input type="file" id="fileInput" multiple accept=".json,.zip,.csv,application/json,application/zip,text/csv" hidden>
    </label>
    <label class="btn"><span data-i18n="loadFolder">Ordner laden</span>
      <input type="file" id="dirInput" webkitdirectory multiple hidden>
    </label>
    <button class="btn" id="vinToggle" type="button" data-i18n-title="hideVinTitle" title="FIN in der Anzeige ausblenden">FIN ausblenden</button>
    <button class="btn ghost" id="clearBtn" type="button" data-i18n="clearAll">Alles entfernen</button>
    <div class="seg" id="themeSwitch" role="group" data-i18n-title="themeLabel">
      <button type="button" data-theme-opt="light" data-i18n-title="themeLight"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button type="button" data-theme-opt="dark" data-i18n-title="themeDark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button>
      <button type="button" data-theme-opt="system" data-i18n-title="themeSystem"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
    </div>
    <div class="seg" id="langSwitch" role="group" data-i18n-title="langLabel">
      <button type="button" data-lang-opt="de" lang="de" title="Deutsch">DE</button>
      <button type="button" data-lang-opt="en" lang="en" title="English">EN</button>
    </div>
  </div>
</header>

<nav class="tabs" id="tabs" hidden>
  <button data-tab="overview" class="active" data-i18n="tabOverview">Übersicht</button>
  <button data-tab="charging" data-i18n="tabCharging" hidden>Laden</button>
  <button data-tab="history" data-i18n="tabHistory">Verlauf</button>
  <button data-tab="activity" data-i18n="tabActivity">Aktivität</button>
  <button data-tab="raw" data-i18n="tabRaw">Rohdaten</button>
  <button data-tab="files" data-i18n="tabFiles">Dateien</button>
</nav>

<main id="main">
  <section id="empty" class="empty">
    <div class="drop" id="dropZone">
      <div class="drop-icon" aria-hidden="true"></div>
      <h2 data-i18n="dropTitle">Export hierher ziehen</h2>
      <p data-i18n-html="dropTextHtml">JSON-Dateien oder ZIP-Archive aus dem VW&nbsp;Group EU&nbsp;Data&nbsp;Act&nbsp;Portal – gerne viele auf einmal oder einen ganzen Ordner.</p>
      <p class="muted" data-i18n="dropPrivacy">Alles bleibt auf diesem Rechner. Es werden keine Daten hochgeladen.</p>
    </div>
  </section>

  <section id="view-overview" class="view" hidden></section>
  <section id="view-charging" class="view" hidden></section>
  <section id="view-history" class="view" hidden></section>
  <section id="view-activity" class="view" hidden></section>
  <section id="view-raw" class="view" hidden></section>
  <section id="view-files" class="view" hidden></section>
</main>

<div class="drop-overlay" id="dropOverlay" hidden><div data-i18n="dropRelease">Loslassen zum Laden</div></div>
<div class="toast" id="toast" hidden></div>

<script src="lib/jszip.min.js"></script>
<script src="lib/chart.umd.min.js"></script>
<script src="lib/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="lib/hammer.min.js"></script>
<script src="lib/chartjs-plugin-zoom.min.js"></script>
<script src="i18n.js?v=1.2.0"></script>
<script src="fields.js?v=1.2.0"></script>
<script src="app.js?v=1.2.0"></script>
</body>
</html>
